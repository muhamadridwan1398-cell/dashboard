function numSort(a,b){var x=parseFloat(a),y=parseFloat(b);return (isNaN(x)||isNaN(y))?String(a).localeCompare(String(b),'en',{numeric:true}):x-y}

/* ---------- data real WMS (Report Cycle Count Summary) ---------- */
function buildReal(){
  REAL=null;if(!RAW||!RAW.meta)return;
  var L={};
  (RAW.rows||[]).forEach(function(r){if(r[1]!=='DONE'||r[6]==null)return;var d=r[2]||'';if(SINCE&&d&&d<SINCE)return;var loc=r[3],o=L[loc]||(L[loc]={items:{},last:''}),k=String(r[4]||'').trim(),x=o.items[k];
    if(!x||d>=x.d)o.items[k]={c:k,d:d,qs:r[5],qc:r[6],m:r[7]==='Matched'};if(d>o.last)o.last=d});
  Object.keys(L).forEach(function(k){var o=L[k],a=Object.keys(o.items).map(function(i){return o.items[i]});o.list=a;o.n=a.length;o.mt=a.filter(function(x){return x.m}).length});

function shortD(d){if(!d)return '';var m=String(d).match(/^\d{4}-(\d{2})-(\d{2})/);if(!m)return d;return +m[2]+' '+['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][+m[1]-1]}

/* ---------- login ---------- */

  var go=function(){var n=$('kdN').value.trim(),p=$('kdP').value.trim();if(!n||!p){say('Isi nama dan PIN.',1);return}
    $('kdLg').disabled=true;say('Memeriksa…');call('login',{name:n,pin:p}).then(function(j){A={name:j.name,pin:p,role:j.role};saveAuth();say('');start()}).catch(function(e){say(e.message,1)}).finally(function(){var b=$('kdLg');if(b)b.disabled=false})};
  $('kdLg').addEventListener('click',go);$('kdP').addEventListener('keydown',function(e){if(e.key==='Enter')go()});$('kdN').addEventListener('keydown',function(e){if(e.key==='Enter')$('kdP').focus()})}
var KDAPP=!!window.__KDAPP,URLONLY=KDAPP||/[?&]kd(=|&|$)/.test(location.search);
function onlyMode(){var on=URLONLY||!!(A&&(A.role==='pic'||A.role==='security'));document.body.classList.toggle('kdonly',on);return on}
function topbar(){onlyMode();$('kdAdmBtn').hidden=KDAPP||!!(A&&(A.role==='pic'||A.role==='security'));var w=$('kdWho'),o=$('kdOut');if(A){w.textContent=A.name+' · '+({pic:'PIC',tl:'Tim Leader',manager:'Manager',security:'Satpam'}[A.role]||A.role);o.hidden=false}else{w.textContent='';o.hidden=true}}

/* ---------- muat data ---------- */
function refresh(quiet){
  if(!A||BUSY)return Promise.resolve();BUSY=true;
  if(A.role==='security')return ucall('gate_get').then(function(j){G=j;render()}).catch(function(e){if(/Nama atau PIN/.test(e.message)){A=null;try{sessionStorage.removeItem(AUTHK)}catch(x){}topbar();loginView()}say(e.message,1)}).finally(function(){BUSY=false});
  return Promise.all([ucall('map'),ucall('real_get').catch(function(){return null}),ucall('done_get',{days:[DK]}),GV==='gate'?ucall('gate_get').catch(function(){return null}):Promise.resolve(G),ucall('verify_get').catch(function(){return null})]).then(function(r){G=r[3];if(r[4]){VER={};(r[4].ver||[]).forEach(function(x){VER[x[0]]={by:x[1],t:x[2]}})}
    MAP={};(r[0].map||[]).forEach(function(x){MAP[x[0]]=x[1]});RAW=r[1];buildReal();
    DONE={};(r[2].done||[]).forEach(function(x){DONE[x[1]]={pic:x[2],note:x[3],t:x[4],st:x[5]||'ok',rsn:x[6]||''}});render()}).catch(function(e){
    if(/Nama atau PIN/.test(e.message)){A=null;try{sessionStorage.removeItem(AUTHK)}catch(x){}topbar();loginView()}
    say(quiet?'Gagal memuat ulang: '+e.message:e.message,1)}).finally(function(){BUSY=false})}

/* ---------- tampilan ---------- */
function bar(p){return '<div class="kdbar '+(p>=100?'':(p>=60?'mid':'lo'))+'"><i style="width:'+Math.min(100,p)+'%"></i></div>'}
function sinceBox(){return '<div class="kdtools"><label class="small">Hitung sejak tanggal <input type="date" id="kdSince" value="'+esc(SINCE)+'" style="padding:6px 8px;border:1px solid var(--line);border-radius:8px"></label><span class="small">'+(SINCE?'Hanya hasil Cycle Count sejak tanggal ini yang dihitung.':'Semua hasil Cycle Count di laporan dihitung.')+'</span></div>'}
function realNote(){return REAL?'<div class="small" style="margin:0 0 8px">Sumber: laporan Cycle Count WMS periode '+esc(REAL.meta.from_d||'?')+' s.d. '+esc(REAL.meta.to_d||'?')+', diperbarui '+esc(hhmm(REAL.meta.at))+'. Lokasi dianggap sudah akurasi bila ada item berstatus DONE dengan Qty Counted terisi.</div>':'<div class="small" style="margin:0 0 8px">Laporan Cycle Count WMS belum diupload (Pengaturan PIC, bagian 3). Sementara progres memakai laporan PIC saja.</div>'}
function locStat(loc){var r=REAL&&REAL.byLoc[loc],d=DONE[loc];return {r:r||null,d:d||null,real:!!r,rep:!!d&&d.st!=='tdk'}}
var OPENF={},SELR=['Salah taruh lokasi','Belum di-input di sistem','Barang rusak','Salah ambil / salah kirim','Belum diketahui','Lainnya'],TDKR=['Lokasi tertutup barang masuk','Ada kegiatan lain','Akses terkunci','Tidak ada barang','Lainnya'],STL={ok:'Sudah dicek',sel:'Ada selisih',tdk:'Tidak bisa dicek'};
function wmsBadge(st){if(!REAL)return '';return st.real?'<span class="kdw w2" title="Hasil Cycle Count terakhir di WMS">Sudah akurasi · '+esc(shortD(st.r.last))+' · '+st.r.n+' item'+(st.r.n?' · '+st.r.mt+' cocok':'')+'</span>':'<span class="kdw w0">Belum ada di laporan WMS</span>'}
function render(){
  topbar();if(!A){loginView();return}
  if(A.role==='security'){var fs=document.activeElement&&document.activeElement.id==='kdGq';$('kdBody').innerHTML=gateView();$('kdSub').textContent='Cek status akurasi PIC sebelum pulang.';if(fs){var q=$('kdGq');q.focus();q.setSelectionRange(q.value.length,q.value.length)}return}
  if(!Object.keys(MAP).length){$('kdBody').innerHTML='<div class="small" style="padding:14px">Belum ada lokasi untuk Anda. Daftar PIC per lokasi belum diupload (Pengaturan PIC, bagian 1).</div>';return}
  var fo=document.activeElement&&document.activeElement.id==='kdSince';
  var fq=document.activeElement&&document.activeElement.id==='kdGq';$('kdBody').innerHTML=(A.role==='pic'?picView():gateTabs()+(GV==='gate'?gateView():leadView()))+'';if(fq){var q2=$('kdGq');if(q2){q2.focus();q2.setSelectionRange(q2.value.length,q2.value.length)}}
  $('kdSub').textContent=A.role==='pic'?'Lokasi tanggung jawab Anda dan status akurasinya.':'Progres akurasi semua lokasi per PIC.'}
function locList(){return Object.keys(MAP).sort(numSort)}
function picView(){
  var ks=locList().filter(function(k){return MAP[k]===A.name}),S={};ks.forEach(function(k){S[k]=locStat(k)});
  var dn=ks.filter(function(k){return REAL?S[k].real:S[k].rep}).length,pc=ks.length?Math.round(dn/ks.length*100):0;
  var show=ks.filter(function(k){var x=REAL?S[k].real:S[k].rep;return FIL==='all'||(FIL==='done'?x:!x)});
  var h='<div class="kdkpi"><div class="kdk"><b>'+dn+' / '+ks.length+'</b><span>lokasi sudah dicek</span></div><div class="kdk"><b>'+pc+'%</b><span>progres</span>'+bar(pc)+'</div></div>';
  h+='<div class="kdtools"><button class="secondary'+(FIL==='todo'?' on':'')+'" data-fil="todo" type="button">Belum</button><button class="secondary'+(FIL==='done'?' on':'')+'" data-fil="done" type="button">Sudah</button><button class="secondary'+(FIL==='all'?' on':'')+'" data-fil="all" type="button">Semua</button></div>';
  if(!ks.length)h+='<div class="small">Tidak ada lokasi untuk Anda.</div>';
  else if(!show.length)h+='<div class="kdcard ok"><b>'+(FIL==='todo'?'Semua lokasi sudah dicek. Terima kasih.':'Tidak ada lokasi di filter ini.')+'</b></div>';
  return h+show.map(function(k){var st=S[k],d=st.d,ok=REAL?st.real:st.rep,of=OPENF[k],stt=d?(d.st||'ok'):'';
    var head='<div class="kdh"><b>'+esc(k)+'</b>'+(d?'<span class="kdst2 t-'+stt+'">'+STL[stt]+' · '+esc(hhmm(d.t))+'</span>':'<span class="sp">Belum dilaporkan</span>')+wmsBadge(st)+(VER[k]?'<span class="kdw w2" title="Diverifikasi TL/MOD">Diverifikasi '+esc(VER[k].by)+' · '+esc(hhmm(VER[k].t))+'</span>':'')+'</div>';
    var body='';
    if(of){var L=of==='sel'?SELR:TDKR;
      body='<div class="kdform"><div class="kdft">'+(of==='sel'?'Alasan selisih':'Alasan tidak bisa dicek')+'</div><select class="kdfr" aria-label="Alasan">'+['<option value="">Pilih alasan</option>'].concat(L.map(function(x){return '<option'+(d&&d.rsn===x?' selected':'')+'>'+esc(x)+'</option>'})).join('')+'</select><input class="kdfn" type="text" maxlength="120" placeholder="Catatan (opsional)" value="'+esc(d&&d.st===of?d.note:'')+'"><div class="kdseg2"><button type="button" class="kdgo" data-fsave="'+of+'">Simpan</button><button type="button" class="secondary" data-fcancel="1">Batal</button></div></div>'}
    else if(d){body=(stt!=='ok'?'<div class="kdrs">'+esc(d.rsn)+(d.note?' · '+esc(d.note):'')+'</div>':'')+'<div class="kdseg2"><button type="button" class="secondary" data-fopen="'+(stt==='ok'?'sel':stt)+'">Ubah</button><button type="button" class="secondary undo" data-mark="0">Batalkan</button></div>'}
    else body='<div class="kdseg"><button type="button" class="kdgo" data-st="ok">Sudah dicek</button><button type="button" class="secondary" data-st="sel">Ada selisih</button><button type="button" class="secondary" data-st="tdk">Tidak bisa dicek</button></div>';
    return '<div class="kdcard'+(ok?' ok':'')+'" data-loc="'+esc(k)+'">'+head+body+
      (st.real?'<details><summary>Hasil hitung terakhir ('+st.r.n+' item)</summary><table><thead><tr><th>Item</th><th class="n">Qty sistem</th><th class="n">Qty hitung</th><th>Hasil</th><th>Tanggal</th></tr></thead><tbody>'+st.r.list.map(function(i){return '<tr><td>'+esc(i.c)+'</td><td class="n">'+fmt(i.qs||0)+'</td><td class="n">'+fmt(i.qc||0)+'</td><td>'+(i.m?'Cocok':'<b style="color:#a94c4c">Tidak cocok</b>')+'</td><td>'+esc(shortD(i.d))+'</td></tr>'}).join('')+'</tbody></table></details>':'')+'</div>'}).join('')}
function leadStats(){
  var P={};
  locList().forEach(function(k){var pic=MAP[k],p=P[pic]||(P[pic]={pic:pic,locs:[],rep:0,real:0,items:0,mt:0,gap:0,last:''}),st=locStat(k);p.locs.push({loc:k,st:st});
    if(st.d&&st.d.st==='sel')p.sel=(p.sel||0)+1;if(st.d&&st.d.st==='tdk')p.tdk=(p.tdk||0)+1;if(st.rep)p.rep++;if(st.real){p.real++;p.items+=st.r.n;p.mt+=st.r.mt;if(st.r.last>p.last)p.last=st.r.last}else if(st.rep)p.gap++;if(!REAL&&st.rep&&st.d.t>p.last)p.last=st.d.t});
  var arr=Object.keys(P).map(function(k){var p=P[k];p.n=p.locs.length;p.done=REAL?p.real:p.rep;p.pc=p.n?Math.round(p.done/p.n*100):0;p.vf=p.locs.filter(function(l){return VER[l.loc]}).length;p.s=p.done===0?0:(p.done<p.n?1:2);p.mp=p.items?Math.round(p.mt/p.items*100):null;return p});
  arr.sort(function(a,b){return a.s-b.s||a.pc-b.pc||a.pic.localeCompare(b.pic)});return arr}
function leadView(){
  var arr=leadStats(),tot=0,dn=0,full=0,gap=0,rp=0,it=0,mt=0;arr.forEach(function(p){tot+=p.n;dn+=p.done;rp+=p.rep;gap+=p.gap;it+=p.items;mt+=p.mt;if(p.s===2)full++});
  var pc=tot?Math.round(dn/tot*100):0,stl=['Belum mulai','Sedang jalan','Selesai'],src=REAL?'Real WMS':'Laporan PIC';
  var h='<div class="kdkpi"><div class="kdk"><b>'+pc+'%</b><span>lokasi sudah akurasi · '+src+'</span>'+bar(pc)+'</div><div class="kdk"><b>'+dn+' / '+tot+'</b><span>lokasi sudah akurasi</span></div><div class="kdk"><b>'+full+' / '+arr.length+'</b><span>PIC selesai 100%</span></div>'+(REAL?'<div class="kdk"><b>'+(it?Math.round(mt/it*100):0)+'%</b><span>item cocok ('+mt+' dari '+it+')</span></div>':'<div class="kdk"><b>'+arr.filter(function(p){return p.s===0}).length+'</b><span>PIC belum mulai</span></div>')+'</div>';
  h+=realNote()+sinceBox()+'<div class="kdtools"><button class="secondary" id="kdCopy" type="button">Salin ringkasan WA</button>'+(REAL&&gap?'<span class="small">'+gap+' lokasi dilaporkan PIC tapi belum ada di WMS.</span>':'')+'<span class="small">Klik baris PIC untuk melihat lokasi dan mencentang verifikasi TL/MOD. Diperbarui tiap 45 detik.</span></div>';
  h+='<div class="ccwrap" style="overflow-x:auto"><table class="kdt"><thead><tr><th>PIC</th><th>Lokasi</th>'+(REAL?'<th>Sudah akurasi</th><th>Cocok</th>':'')+'<th>Lapor PIC</th><th>Progres</th><th>Status</th><th>Verifikasi TL/MOD</th><th>Terakhir</th></tr></thead><tbody>'+arr.map(function(p){
    var row='<tr class="pr" data-pic="'+esc(p.pic)+'"><td><b>'+esc(p.pic)+'</b></td><td>'+p.n+'</td>'+(REAL?'<td>'+p.real+'</td><td>'+(p.mp==null?'–':p.mp+'%')+'</td>':'')+'<td>'+p.rep+(p.sel?' <span class="kdgap" title="Dilaporkan ada selisih">('+p.sel+' selisih)</span>':'')+(p.tdk?' <span class="kdgap" title="Tidak bisa dicek">('+p.tdk+' tdk bisa dicek)</span>':'')+(REAL&&p.gap?' <span class="kdgap" title="Dilaporkan PIC tetapi belum ada di laporan WMS">('+p.gap+' belum di WMS)</span>':'')+'</td><td style="min-width:130px">'+bar(p.pc)+'<span class="small">'+p.pc+'%</span></td><td><span class="kdst s'+p.s+'">'+stl[p.s]+'</span></td><td>'+p.vf+' / '+p.n+'</td><td class="small">'+(p.last?esc(p.last.length>10?hhmm(p.last):shortD(p.last)):'–')+'</td></tr>';
    if(!OPEN['p:'+p.pic])return row;
    var ls=p.locs.filter(function(l){var x=REAL?l.st.real:l.st.rep;return LF==='all'||(LF==='done'?x:!x)}),nd=p.locs.filter(function(l){return REAL?l.st.real:l.st.rep}).length;
    return row+'<tr><td colspan="'+(REAL?9:7)+'"><div class="kdtools"><button class="secondary'+(LF==='todo'?' on':'')+'" data-lf="todo" type="button">Belum ('+(p.n-nd)+')</button><button class="secondary'+(LF==='done'?' on':'')+'" data-lf="done" type="button">Sudah ('+nd+')</button><button class="secondary'+(LF==='all'?' on':'')+'" data-lf="all" type="button">Semua ('+p.n+')</button><button class="secondary" type="button" data-verall="'+esc(p.pic)+'">Centang semua yang sudah akurasi</button><span class="small">Centang = lokasi sudah Anda verifikasi.</span></div>'+
      '<div class="kdlocs">'+ls.map(function(l){var st=l.st,c=st.real?'d':(st.rep?'r':''),t=st.real?'Sudah akurasi '+shortD(st.r.last)+' · '+st.r.n+' item, '+st.r.mt+' cocok'+(st.rep?' · dilaporkan PIC':''):(st.rep?'Dilaporkan PIC, belum ada di WMS':'Belum akurasi');
        var v=VER[l.loc];if(st.d&&st.d.st!=='ok')t+=' · '+STL[st.d.st]+': '+st.d.rsn+(st.d.note?' ('+st.d.note+')':'');return '<label class="'+c+(v?' v':'')+'" title="'+esc(t+(v?' · diverifikasi '+v.by+' '+hhmm(v.t):''))+'"><input type="checkbox" data-ver="'+esc(l.loc)+'"'+(v?' checked':'')+'> '+esc(l.loc)+(st.real?' ✓ '+esc(shortD(st.r.last)):(st.rep?' ●':''))+(st.d&&st.d.st!=='ok'?' ⚠':'')+'</label>'}).join('')+(ls.length?'':'<span class="small" style="border:0">Tidak ada lokasi di filter ini.</span>')+'</div></td></tr>'}).join('')+'</tbody></table></div>';
